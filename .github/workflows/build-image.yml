name: Build and Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/musebase-ops-pilot
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Check registry configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo 'Missing DOCKER_USERNAME secret'; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo 'Missing DOCKER_PASSWORD secret'; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check runtime modules
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=ci-placeholder \
            -e GITHUB_TOKEN=ci-placeholder \
            --entrypoint node "$IMAGE:sha-$GITHUB_SHA" \
            --input-type=module -e \
            "await import('./dist/api/app.js'); await import('./dist/agent/runtime.js'); console.log('Runtime modules loaded');"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

  publish-latest:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize only latest-tag promotion; every main commit still builds its SHA image.
    concurrency:
      group: ops-pilot-latest
      cancel-in-progress: false
    steps:
      - name: Check current main revision
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            core.setOutput('current', String(data.object.sha === context.sha));

      - name: Log in to Docker Hub
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Publish latest tag
        if: steps.revision.outputs.current == 'true'
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/musebase-ops-pilot
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
